# docker compose up --build      (needs the key for your NDR_PROVIDER in .env: GEMINI_API_KEY or ANTHROPIC_API_KEY)
x-app: &app
  build: .
  environment:
    NDR_PROVIDER: ${NDR_PROVIDER:-anthropic}          # anthropic | gemini
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    NDR_MODEL: ${NDR_MODEL:-claude-haiku-4-5-20251001}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
    DATABASE_URL: postgresql://ndr:ndr@postgres:5432/ndr
    REDIS_URL: redis://redis:6379
    EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-fastembed}
    RETRIEVAL_K: ${RETRIEVAL_K:-3}
    RETRIEVAL_MAX_DISTANCE: ${RETRIEVAL_MAX_DISTANCE:-0.35}
    API_KEY: ${API_KEY:-}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: ndr, POSTGRES_PASSWORD: ndr, POSTGRES_DB: ndr }  # local dev only
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ndr"], interval: 5s, timeout: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  api:
    <<: *app
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    <<: *app
    command: ["arq", "app.worker.WorkerSettings"]
    # Starts after the API is healthy because the API creates the schema on boot. Two processes running
    # CREATE TABLE IF NOT EXISTS at the same instant can race. In k8s, run schema setup as a migration job instead.
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
