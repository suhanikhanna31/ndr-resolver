name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q
      # Pipeline sanity check with the free regex baseline (no API key needed)
      - run: python -m evals.run_evals --provider baseline --no-gate
